# Based on b_phi/HOD_config/tmp/abacushod_c004_ph000_z0.500.yaml.
# Snapshot/cosmology are fixed here; individual HOD draws are applied in Python.
sim_params:
  sim_dir: /global/cfs/projectdirs/desi/cosmosim/Abacus/
  sim_name: AbacusSummit_base_c004_ph000
  output_dir: ./hod_catalog_output/
  subsample_dir: ./abacus_hod_subsamples/
  z_mock: 0.500
  cleaned_halos: true
HOD_params:
  use_particles: true
  want_ranks: false
  want_AB: true
  want_shear: false
  density_sigma: 3
  tracer_flags:
    LRG: true
    ELG: false
    QSO: false
  want_rsd: true
  write_to_disk: false
  LRG_params:
    logM_cut: 12.79
    logM1: 13.88
    sigma: 0.15
    alpha: 1.07
    kappa: 1.4
    alpha_c: 0.33
    alpha_s: 0.8
    ic: 0.7
    s: 0
    s_v: 0
    s_p: 0
    s_r: 0
    Acent: 0
    Asat: 0
    Bcent: 0
    Bsat: 0
clustering_params:
  clustering_type: xirppi
  bin_params:
    logmin: -2
    logmax: 2
    nbins: 49
  pimax: 40
